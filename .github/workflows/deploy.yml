name: Deploy Audora

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'mobile-polish.css'
      - 'typography.css'
      - 'app.js'
      - 'i18n.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: audora-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.HOST }}
      DEPLOY_PASS: ${{ secrets.PASS }}
      DEPLOY_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secrets
        run: |
          test -n "$DEPLOY_HOST" || (echo 'HOST secret is missing' && exit 1)
          test -n "$DEPLOY_PASS" || (echo 'PASS secret is missing' && exit 1)

      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Resolve SSH target and authentication
        shell: bash
        run: |
          set -euo pipefail

          SSH_HOST="$DEPLOY_HOST"
          SSH_PORT="22"
          HOST_USER=""

          if [[ "$SSH_HOST" == *"@"* ]]; then
            HOST_USER="${SSH_HOST%@*}"
            SSH_HOST="${SSH_HOST#*@}"
          fi

          if [[ "$SSH_HOST" == *":"* ]]; then
            MAYBE_PORT="${SSH_HOST##*:}"
            if [[ "$MAYBE_PORT" =~ ^[0-9]+$ ]]; then
              SSH_PORT="$MAYBE_PORT"
              SSH_HOST="${SSH_HOST%:*}"
            fi
          fi

          if [[ "$DEPLOY_PASS" == *"BEGIN "*"PRIVATE KEY"* ]]; then
            printf '%s\n' "$DEPLOY_PASS" > /tmp/audora_ssh_key
            chmod 600 /tmp/audora_ssh_key
            SSH_AUTH="key"
          else
            export SSHPASS="$DEPLOY_PASS"
            SSH_AUTH="password"
          fi

          CANDIDATES=()
          if [[ -n "${DEPLOY_USER:-}" ]]; then CANDIDATES+=("$DEPLOY_USER"); fi
          if [[ -n "$HOST_USER" ]]; then CANDIDATES+=("$HOST_USER"); fi
          CANDIDATES+=(root ubuntu debian admin deploy centos ec2-user)

          declare -A SEEN=()
          for USERNAME in "${CANDIDATES[@]}"; do
            [[ -n "$USERNAME" ]] || continue
            [[ -z "${SEEN[$USERNAME]:-}" ]] || continue
            SEEN[$USERNAME]=1

            if [[ "$SSH_AUTH" == "key" ]]; then
              if ssh -i /tmp/audora_ssh_key -p "$SSH_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o BatchMode=yes "$USERNAME@$SSH_HOST" 'printf ok' >/dev/null 2>&1; then
                echo "SSH user resolved: $USERNAME"
                echo "SSH_TARGET=$USERNAME@$SSH_HOST" >> "$GITHUB_ENV"
                echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
                echo "SSH_AUTH=$SSH_AUTH" >> "$GITHUB_ENV"
                exit 0
              fi
            else
              if sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no -o ConnectTimeout=8 -o PreferredAuthentications=keyboard-interactive,password -o PubkeyAuthentication=no "$USERNAME@$SSH_HOST" 'printf ok' >/dev/null 2>&1; then
                echo "SSH user resolved: $USERNAME"
                echo "SSH_TARGET=$USERNAME@$SSH_HOST" >> "$GITHUB_ENV"
                echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
                echo "SSH_AUTH=$SSH_AUTH" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
          done

          echo 'SSH authentication failed with the supplied HOST/PASS credentials.'
          echo "HOST includes username: $([[ -n "$HOST_USER" ]] && echo yes || echo no)"
          echo "SSH_USER secret present: $([[ -n "${DEPLOY_USER:-}" ]] && echo yes || echo no)"
          echo "PASS detected as: $SSH_AUTH"
          exit 1

      - name: Prepare SSH command
        shell: bash
        run: |
          if [[ "$SSH_AUTH" == "key" ]]; then
            echo 'SSH_BASE=ssh -i /tmp/audora_ssh_key' >> "$GITHUB_ENV"
            echo 'SCP_BASE=scp -i /tmp/audora_ssh_key' >> "$GITHUB_ENV"
          else
            echo 'SSH_BASE=sshpass -e ssh' >> "$GITHUB_ENV"
            echo 'SCP_BASE=sshpass -e scp' >> "$GITHUB_ENV"
          fi

      - name: Prepare server and Nginx
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DEPLOY_PASS"
          REMOTE_SHELL="bash -s"
          if [[ "$SSH_TARGET" != root@* ]]; then REMOTE_SHELL="sudo -n bash -s"; fi
          $SSH_BASE -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_TARGET" "$REMOTE_SHELL" <<'REMOTE'
          set -euo pipefail

          DOMAIN="audora.smarbiz.sbs"
          WEBROOT="/var/www/audora"

          if ! command -v nginx >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
          fi

          mkdir -p "$WEBROOT"

          cat > /etc/nginx/sites-available/audora.smarbiz.sbs <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name audora.smarbiz.sbs;

              root /var/www/audora;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location ~* \.(?:css|js)$ {
                  expires -1;
                  add_header Cache-Control "no-cache, no-store, must-revalidate";
                  try_files $uri =404;
              }

              location ~* \.(?:jpg|jpeg|gif|png|svg|webp|ico|woff2?)$ {
                  expires 7d;
                  add_header Cache-Control "public, max-age=604800";
                  try_files $uri =404;
              }
          }
          NGINX

          ln -sfn /etc/nginx/sites-available/audora.smarbiz.sbs /etc/nginx/sites-enabled/audora.smarbiz.sbs
          nginx -t
          systemctl enable nginx >/dev/null 2>&1 || true
          systemctl reload nginx || systemctl restart nginx
          REMOTE

      - name: Upload prototype
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DEPLOY_PASS"
          tar -czf /tmp/audora-site.tgz index.html styles.css mobile-polish.css typography.css app.js i18n.js
          $SCP_BASE -P "$SSH_PORT" -o StrictHostKeyChecking=no /tmp/audora-site.tgz "$SSH_TARGET":/tmp/audora-site.tgz
          REMOTE_SHELL="bash -s"
          if [[ "$SSH_TARGET" != root@* ]]; then REMOTE_SHELL="sudo -n bash -s"; fi
          $SSH_BASE -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_TARGET" "$REMOTE_SHELL" <<'REMOTE'
          set -euo pipefail
          rm -rf /var/www/audora/*
          tar -xzf /tmp/audora-site.tgz -C /var/www/audora
          rm -f /tmp/audora-site.tgz

          printf '\n\n/* ===== responsive polish layer ===== */\n' >> /var/www/audora/styles.css
          cat /var/www/audora/mobile-polish.css >> /var/www/audora/styles.css
          printf '\n\n/* ===== global typography layer ===== */\n' >> /var/www/audora/styles.css
          cat /var/www/audora/typography.css >> /var/www/audora/styles.css

          chown -R www-data:www-data /var/www/audora
          find /var/www/audora -type d -exec chmod 755 {} \;
          find /var/www/audora -type f -exec chmod 644 {} \;
          nginx -t
          systemctl reload nginx
          response="$(curl -fsS -H 'Host: audora.smarbiz.sbs' http://127.0.0.1/)"
          grep -qi 'Audora' <<< "$response"
          REMOTE

      - name: Enable HTTPS
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$DEPLOY_PASS"
          REMOTE_SHELL="bash -s"
          if [[ "$SSH_TARGET" != root@* ]]; then REMOTE_SHELL="sudo -n bash -s"; fi
          $SSH_BASE -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_TARGET" "$REMOTE_SHELL" <<'REMOTE'
          set -euo pipefail
          DOMAIN="audora.smarbiz.sbs"

          if ! command -v certbot >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y certbot python3-certbot-nginx
          fi

          certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email --redirect
          nginx -t
          systemctl reload nginx
          REMOTE

      - name: Verify live site
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if response="$(curl -fsSL --max-time 15 https://audora.smarbiz.sbs/)" && grep -qi 'Audora' <<< "$response"; then
              echo 'Audora is live over HTTPS.'
              exit 0
            fi
            sleep 5
          done
          echo 'Live verification failed.'
          exit 1
