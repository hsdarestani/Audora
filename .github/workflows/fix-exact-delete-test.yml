name: Fix exact delete E2E assertion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-exact-delete-test.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace substring assertion with exact listing slug
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests-ui/audora-final.spec.js')
          text = path.read_text()
          old = "await expect(page.locator('#discoverGrid [data-listing-card]', { hasText: listingName })).toHaveCount(0);"
          new = "await expect(page.locator(`#discoverGrid [data-listing-card=\"ui-studio-${runId}\"]`)).toHaveCount(0);"
          if old not in text:
              raise SystemExit('target assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests-ui/audora-final.spec.js
          git commit -m 'Use exact listing slug in provider delete E2E'
          git push
