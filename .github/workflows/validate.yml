name: Validate Audora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check api.js
          node --check booking-ui.js
          node --check i18n.js
      - name: Check backend Python syntax
        run: python -m compileall -q backend
      - name: Verify translation coverage
        run: |
          node <<'NODE'
          const fs=require('fs');
          global.window={};
          require('./i18n.js');
          const dict=window.I18N;
          const html=fs.readFileSync('index.html','utf8');
          const keys=[...html.matchAll(/data-i18n(?:-html|-placeholder)?="([^"]+)"/g)].map(m=>m[1]);
          const get=(o,p)=>p.split('.').reduce((v,k)=>v&&v[k],o);
          for(const locale of ['de','en']){
            const missing=[...new Set(keys)].filter(k=>get(dict[locale],k)===undefined);
            if(missing.length){console.error(`${locale} missing:`,missing.join(', '));process.exit(1)}
          }
          console.log(`Translation coverage OK: ${new Set(keys).size} interface keys in DE + EN`);
          NODE
      - name: Verify required full-stack files
        run: |
          test -s index.html
          test -s styles.css
          test -s mobile-polish.css
          test -s typography.css
          test -s functionality.css
          test -s app.js
          test -s api.js
          test -s booking-ui.js
          test -s i18n.js
          test -s requirements.txt
          test -s backend/manage.py
          test -s backend/core/models.py
          test -s backend/core/views.py
          test -s backend/core/marketplace_views.py
          test -s backend/core/calendar_views.py
          test -s backend/core/booking_views.py
          test -s backend/core/action_views.py
